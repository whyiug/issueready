name: Bug report
description: Report reproducible incorrect behavior in IssueReady
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve IssueReady. Remove secrets and private issue content before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, package version, or commit SHA where the problem occurs.
      placeholder: main at abc1234
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a small local fixture or repository that contains no private data.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js version, operating system, and the command you ran.
      render: text
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add redacted logs or screenshots if they help explain the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue that describes this problem.
          required: true
        - label: This report contains no credentials, private issue content, or production data.
          required: true
        - label: This is not a security vulnerability.
          required: true

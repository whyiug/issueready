name: Feature request
description: Propose an improvement to IssueReady
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer or contributor workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the observable behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain workarounds or smaller options you considered.
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and compatibility boundaries
      description: Note any effect on determinism, privacy, schemas, GitHub access, or write authorization.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing request that covers this outcome.
          required: true
        - label: The request does not require unauthorized testing or public-target probing.
          required: true

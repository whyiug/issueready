name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: List the smallest reproducible steps.
    validations:
      required: true
